default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: validate-articles
        name: Validate article frontmatter and assets
        description: Auto-fills `series` frontmatter from directory location (scripts/apply_series_from_dir.py, mirrors publish.yml) then catches frontmatter/asset errors (e.g. a cover_image or inline image pointing at a missing file) before they reach CI. If series-filling modifies a file, re-`git add` it and recommit. Does not catch asset-only edits or a reference to a not-yet-`git add`ed asset — see scripts/validate_articles.py.
        entry: make validate
        language: python
        # Mirrors scripts/requirements.txt's PyYAML pin — pre-commit's own dependency updater does not track additional_dependencies in a `local` hook, so Dependabot bumping requirements.txt won't bump this; bump both together by hand.
        additional_dependencies: ['PyYAML==6.0.3']
        pass_filenames: true
