name: Publish to dev.to

on:
  push:
    branches:
      - main
    paths:
      - "articles/**/*.md"
      - "articles/assets/**"
  workflow_dispatch:
    inputs:
      scope:
        description: "Which articles to push"
        type: choice
        options:
          - changed
          - all
        default: changed

# Both this workflow and Schedule Publisher commit to main. Sharing one concurrency group keeps their pushes from racing into a non-fast-forward.
concurrency:
  group: devto-main-write
  cancel-in-progress: false

env:
  # Pinned: an unpinned global install would silently pick up whatever the registry serves at build time.
  DEVTO_CLI_VERSION: "1.4.0"
  ARTICLE_LIST: articles.nul

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          npm install -g "@sinedied/devto-cli@${DEVTO_CLI_VERSION}"

      - name: Collect articles to push
        id: collect
        env:
          SCOPE: ${{ inputs.scope }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          list="${RUNNER_TEMP}/${ARTICLE_LIST}"

          # Flat articles/*.md plus one-level-deep series directories (articles/<dir>/*.md), excluding the reserved dirs that already have distinct meaning (TIL notes, per-article assets, gitignored drafts/translations). ':(glob)' stops '*' from matching '/', so combined with ':(exclude,glob)' this stays exactly one level deep.
          series_pathspecs=(
            ':(glob)articles/*.md'
            ':(glob)articles/*/*.md'
            ':(exclude,glob)articles/TIL/*.md'
            ':(exclude,glob)articles/assets/*.md'
            ':(exclude,glob)articles/DRAFT/*.md'
            ':(exclude,glob)articles/JA/*.md'
          )

          if [ "$EVENT" = "workflow_dispatch" ] && [ "$SCOPE" = "all" ]; then
            git ls-files -z -- "${series_pathspecs[@]}" > "$list"
          else
            base="$BEFORE"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # First push on a branch, or a force-push rewrote history.
              base="$(git rev-parse "${AFTER}^" 2>/dev/null || echo "$AFTER")"
            fi
            git diff -z --name-only --diff-filter=d "$base" "$AFTER" -- "${series_pathspecs[@]}" > "$list"

            # Asset-only changes don't touch the article's markdown, but the article still needs to be re-pushed so devto-cli's diff check (full file content equality) picks up the cache-busted image reference bump_asset_versions.py is about to write. See https://github.com/kasir-barati/dev.to/issues/2.
            assets_list="${RUNNER_TEMP}/articles-assets.nul"
            git diff -z --name-only --diff-filter=d "$base" "$AFTER" -- ':(glob)articles/assets/**' > "$assets_list"
            asset_files=()
            mapfile -d '' -t asset_files < "$assets_list"
            if [ "${#asset_files[@]}" -gt 0 ]; then
              bump_output="${RUNNER_TEMP}/bump-output.txt"
              python scripts/bump_asset_versions.py "${asset_files[@]}" > "$bump_output"
              bumped_articles=()
              mapfile -t bumped_articles < "$bump_output"
              if [ "${#bumped_articles[@]}" -gt 0 ]; then
                files=()
                mapfile -d '' -t files < "$list"
                for a in "${bumped_articles[@]}"; do
                  files+=("$a")
                done
                printf '%s\0' "${files[@]}" | python3 -c "
          import sys
          seen = []
          for chunk in sys.stdin.buffer.read().split(b'\0'):
              if chunk and chunk not in seen:
                  seen.append(chunk)
          sys.stdout.buffer.write(b'\0'.join(seen))
          sys.stdout.buffer.write(b'\0' if seen else b'')
          " > "$list"
              fi
            fi
          fi

          files=()
          mapfile -d '' -t files < "$list"
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          echo "Articles to push: ${#files[@]}"
          if [ "${#files[@]}" -gt 0 ]; then
            printf '  %s\n' "${files[@]}"
          fi

      - name: Apply series from directory
        if: steps.collect.outputs.count != '0'
        run: |
          set -euo pipefail
          mapfile -d '' -t files < "${RUNNER_TEMP}/${ARTICLE_LIST}"
          python scripts/apply_series_from_dir.py "${files[@]}"

      - name: Validate articles
        if: steps.collect.outputs.count != '0'
        run: |
          set -euo pipefail
          mapfile -d '' -t files < "${RUNNER_TEMP}/${ARTICLE_LIST}"
          python scripts/validate_articles.py "${files[@]}"

      - name: Publish articles
        if: steps.collect.outputs.count != '0'
        env:
          # devto-cli reads DEVTO_TOKEN from the environment. Passing the key as an argv flag would expose it to anything that can read /proc on the runner; the env var does not appear in the process table.
          DEVTO_TOKEN: ${{ secrets.DEVTO_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEVTO_TOKEN" ]; then
            echo "::error::DEVTO_API_KEY secret is not set; nothing was published."
            exit 1
          fi
          mapfile -d '' -t files < "${RUNNER_TEMP}/${ARTICLE_LIST}"

          # One invocation for the whole batch. devto-cli fetches the full remote article list once per run, throttles writes internally (30 updates/30s, 10 creates/30s) and retries 429s, so per-file loops with sleeps only multiply the remote fetches.
          dev push "${files[@]}" -r "${GITHUB_REPOSITORY}" -b "${GITHUB_REF_NAME}" --verbose

      - name: Commit and push metadata written back by devto-cli
        if: steps.collect.outputs.count != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -- ':(glob)articles/*.md' ':(glob)articles/*/*.md' \
            ':(exclude,glob)articles/TIL/*.md' ':(exclude,glob)articles/assets/*.md' \
            ':(exclude,glob)articles/DRAFT/*.md' ':(exclude,glob)articles/JA/*.md'
          if git diff --cached --quiet; then
            echo "No frontmatter changes to commit."
            exit 0
          fi

          git commit -m "chore: update article metadata from dev.to [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/${GITHUB_REF_NAME}."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the metadata commit after 3 attempts."
          exit 1
